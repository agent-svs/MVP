      - '{"context": "What can I help you with?", "utterance": "Okay so my name is John Smith and I want to book a dermatology appointment for next Tuesday at 10am", "intent": "book_appointment", "slots": {"patient_name": "John Smith", "service_type": "dermatology", "date": "next Tuesday", "time": "10am"}}'
