  - name: "Greeting"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      Generate GREETING utterances. These happen at the start of conversations.
      
      IMPORTANT DISAMBIGUATION:
      - "Okay I want to book" is NOT a greeting — it's book_appointment
      - "Hello" alone IS a greeting
      - "Hi, I need an appointment" → intent is book_appointment, NOT greeting
        (the greeting is just a prefix, the intent is the booking)
      - ONLY pure greetings with no other intent should be labeled as greeting
      
      RULES:
      - intent MUST be "greeting"
      - slots should be empty {}
      - Context should be empty or a system greeting
      - Include: "Hello", "Hi there", "Good morning", "Hey", "Hi I am a patient"
      - EXCLUDE anything that embeds another intent (those belong to the other intent)
      
      Output format (one JSON per line):
      {"context": "system context", "utterance": "user utterance", "intent": "greeting", "slots": {}}
    n: 100
    few_shot_examples:
      - '{"context": "", "utterance": "Hello", "intent": "greeting", "slots": {}}'
