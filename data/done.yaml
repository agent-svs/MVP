# ============================================================
# Configuration — Joint NLU Dataset Generation
# AI Voice Receptionist (Clinic/Hospital Domain)
#
# Generates context-aware examples for a Joint Intent + Slot model.
# Each example has:
#   - context:   The system's previous utterance (what the AI just said)
#   - utterance:  The user's current response
#   - intent:     One of 30 intent labels (or "slot_answer" for bare answers)
#   - slots:      Dict of {slot_type: value} extracted from the utterance
#
# CRITICAL PROBLEM THIS DATASET SOLVES:
#   Humans speak in short, context-dependent ways. "Okay", "Cardiology",
#   "Tomorrow", "John" — these are valid slot answers when the system just
#   asked a direct question, but they look like random words without context.
#   A separate NER + intent classifier pipeline fails on these because:
#     1. NER extracts "Okay" as a confirmation when it's just filler
#     2. Intent classifier tries to find an intent for "Cardiology" 
#        (a service name, not an intent)
#     3. One-word answers get misclassified as greetings or out-of-domain
#
#   The joint model receives BOTH the system context AND the user utterance,
#   so it can distinguish:
#     Context: "Is Thursday okay?" + User: "Okay" → confirmation
#     Context: "What service?"     + User: "Okay, cardiology" → slot_answer
#     Context: (first turn)        + User: "Okay hi" → greeting
#
# VALID SLOT TYPES:
#   service_type   — The medical service (cardiology, dermatology, dental, etc.)
#   date           — Appointment date (tomorrow, Monday, March 15th, next week, etc.)
#   time           — Appointment time (3pm, 10:30 am, morning, afternoon, etc.)
#   patient_name   — Patient's full name (John Smith, Maria Garcia, etc.)
#   doctor_name    — Doctor's name (Dr. Patel, Dr. Sarah Wilson, etc.)
#   phone          — Phone number (555-123-4567, 9876543210, etc.)
#   department     — Hospital department (emergency, pediatrics, radiology, etc.)
#
# VALID INTENT LABELS (30 + slot_answer):
#   slot_answer, greeting, goodbye, confirmation, denial, help, repeat,
#   book_appointment, cancel_appointment, reschedule_appointment,
#   confirm_appointment, check_appointment_status, check_my_appointments,
#   change_date, change_time, change_doctor, change_service,
#   register_new_patient, update_contact_info, verify_patient_identity,
#   clinic_hours, clinic_location, consultation_fee,
#   doctor_specialization, doctor_availability, services_available,
#   complaint, transfer_to_human, emergency_request, out_of_domain
# ============================================================

objectives:

  # ================================================================
  # SLOT_ANSWER — THE MOST CRITICAL INTENT (bare answers to questions)
  # ================================================================
  # This is the hardest category. The user gives a short, direct answer 
  # to a question the system just asked. Without context, these look 
  # meaningless. With context, they are clearly slot fills.
  # ================================================================

  - name: "Slot Answer — Service Type"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      THE PROBLEM: When the AI asks "What service do you need?" and the user replies 
      with just "Cardiology" or "I need dental", a naive NLU model tries to classify 
      this as an intent and fails — because it's NOT an intent, it's a SLOT ANSWER.
      The user is answering the AI's question with a service type value.
      
      Generate realistic user utterances where the user is ANSWERING a question about 
      what medical service they need. The AI (system) has just asked about the service.
      
      RULES:
      - The context MUST be a system question asking about the service type
      - The utterance is the user's answer — can be bare ("Cardiology"), casual 
        ("Umm, I think cardiology"), or embedded ("I'd like to see someone about my skin")
      - intent MUST be "slot_answer"
      - slots MUST contain "service_type" with the extracted service value
      - Include filler words like "okay", "umm", "well", "yeah", "so" naturally
      - Include hesitations: "I think...", "Maybe...", "Probably..."
      - Include both specific services (cardiology, dermatology) and vague descriptions 
        ("something for my heart", "skin issues", "pain in my teeth")
      - Some utterances should be just ONE WORD (the service name alone)
      
      Medical services to use: cardiology, dermatology, dental, orthopedics, 
      pediatrics, ophthalmology, neurology, psychiatry, general checkup, 
      ENT, gynecology, urology, physiotherapy, radiology, oncology, 
      gastroenterology, pulmonology, endocrinology, allergy, vaccination
      
      Output format (one JSON per line):
      {"context": "system question", "utterance": "user answer", "intent": "slot_answer", "slots": {"service_type": "extracted_value"}}
    n: 120
    few_shot_examples:
      - '{"context": "What type of service are you looking for?", "utterance": "Cardiology", "intent": "slot_answer", "slots": {"service_type": "cardiology"}}'
      - '{"context": "Which service would you like to book?", "utterance": "Umm, dental I think", "intent": "slot_answer", "slots": {"service_type": "dental"}}'
      - '{"context": "What kind of appointment do you need?", "utterance": "Okay so I need something for my skin", "intent": "slot_answer", "slots": {"service_type": "dermatology"}}'
      - '{"context": "Sure, what service can I help you with?", "utterance": "Yeah orthopedics", "intent": "slot_answer", "slots": {"service_type": "orthopedics"}}'
      - '{"context": "And which department would you like?", "utterance": "I have been having chest pains", "intent": "slot_answer", "slots": {"service_type": "cardiology"}}'
      - '{"context": "What type of specialist do you want to see?", "utterance": "Eye doctor", "intent": "slot_answer", "slots": {"service_type": "ophthalmology"}}'
      - '{"context": "Which service should I book for you?", "utterance": "Well actually I need a general checkup", "intent": "slot_answer", "slots": {"service_type": "general checkup"}}'



  - name: "Slot Answer — Date"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      THE PROBLEM: When the AI asks "What date would you like?" and the user replies 
      "Tomorrow" or "Next Monday", the NLU model shouldn't try to classify this as an 
      intent — it's a date slot answer to the AI's question.
      
      Generate realistic user utterances where the user is ANSWERING a question about 
      what date they want for their appointment. The AI has just asked about the date.
      
      RULES:
      - The context MUST be a system question asking about the date
      - The utterance is the user's answer with a date value
      - intent MUST be "slot_answer"
      - slots MUST contain "date" with the date expression as spoken
      - Include relative dates: tomorrow, next week, Monday, this Friday
      - Include specific dates: March 15th, the 20th, April 3rd
      - Include vague dates: "next week sometime", "as soon as possible", "this week"
      - Include fillers: "Okay how about tomorrow", "Umm maybe Monday"
      - Some should be bare single words: "Tomorrow", "Monday", "Wednesday"
      
      Output format (one JSON per line):
      {"context": "system question", "utterance": "user answer", "intent": "slot_answer", "slots": {"date": "date_expression"}}
    n: 100
    few_shot_examples:
      - '{"context": "What date would you like your appointment?", "utterance": "Tomorrow", "intent": "slot_answer", "slots": {"date": "tomorrow"}}'
      - '{"context": "Which day works best for you?", "utterance": "Umm, next Monday I think", "intent": "slot_answer", "slots": {"date": "next Monday"}}'
      - '{"context": "When would you like to come in?", "utterance": "How about this Friday", "intent": "slot_answer", "slots": {"date": "this Friday"}}'
      - '{"context": "And what date should I schedule that for?", "utterance": "March 15th please", "intent": "slot_answer", "slots": {"date": "March 15th"}}'
      - '{"context": "Sure, which day?", "utterance": "Okay the day after tomorrow works", "intent": "slot_answer", "slots": {"date": "day after tomorrow"}}'
      - '{"context": "What day were you thinking?", "utterance": "Wednesday", "intent": "slot_answer", "slots": {"date": "Wednesday"}}'

  - name: "Slot Answer — Time"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      THE PROBLEM: When the AI asks "What time would you prefer?" and the user says 
      "3pm" or "Morning", the model must recognize this as a time slot answer, not 
      try to classify "3pm" as an intent.
      
      Generate realistic user utterances where the user is ANSWERING a question about 
      what time they want their appointment. The AI has just asked about the time.
      
      RULES:
      - The context MUST be a system question asking about the time
      - The utterance is the user's answer with a time value
      - intent MUST be "slot_answer"
      - slots MUST contain "time" with the time expression as spoken
      - Include specific times: 3pm, 10:30 am, 2 o'clock, half past four
      - Include vague times: morning, afternoon, evening, after lunch
      - Include fillers: "Okay 3pm works", "Hmm maybe around 2"
      - Some should be bare: "3pm", "Morning", "10:30"
      
      Output format (one JSON per line):
      {"context": "system question", "utterance": "user answer", "intent": "slot_answer", "slots": {"time": "time_expression"}}
    n: 100
    few_shot_examples:
      - '{"context": "What time would you prefer?", "utterance": "3pm", "intent": "slot_answer", "slots": {"time": "3pm"}}'
      - '{"context": "What time works best for you?", "utterance": "Umm around 10 in the morning", "intent": "slot_answer", "slots": {"time": "10 in the morning"}}'
      - '{"context": "And what time should I book that for?", "utterance": "Afternoon please, maybe 2:30", "intent": "slot_answer", "slots": {"time": "2:30 pm"}}'
      - '{"context": "Sure, any preferred time?", "utterance": "Okay how about 4 o clock", "intent": "slot_answer", "slots": {"time": "4 o clock"}}'
      - '{"context": "What time on Monday?", "utterance": "Morning", "intent": "slot_answer", "slots": {"time": "morning"}}'


  - name: "Slot Answer — Patient Name"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      THE PROBLEM: When the AI asks "May I have your name?" and the user says 
      "John Smith" or "It's Maria", the model must recognize this as a name slot 
