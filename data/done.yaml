  # ================================================================
  # CONFIRMATION — Context-dependent "yes" / "okay" / "sure"
  # ================================================================
  # This is the #2 hardest category. "Okay" is confirmation ONLY when
  # the system asked a yes/no question. NOT when it asked for a slot.
  # ================================================================

  - name: "Confirmation"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      THE CRITICAL AMBIGUITY PROBLEM:
      The word "Okay" means COMPLETELY different things depending on context:
        - System: "Is Thursday at 3pm fine?" → User: "Okay" → This IS confirmation
        - System: "What service do you need?" → User: "Okay cardiology" → This is NOT confirmation, it's a slot answer
        - System: "I've booked your appointment" → User: "Okay thanks" → This is goodbye/acknowledgment
      
      Generate utterances where the user IS genuinely CONFIRMING something the system 
      proposed or asked in a yes/no format. The system context must be a confirmable 
      question or statement.
      
      RULES:
      - Context MUST be a yes/no question or a proposal to confirm
        Examples: "Is Thursday okay?", "Shall I book cardiology at 3pm?",
        "So that's a dental appointment for Monday — correct?",
        "I have John Smith, tomorrow at 2pm for cardiology. Should I confirm?"
      - Utterance is the user confirming: "Yes", "Yeah", "Okay", "That's right",
        "Sure", "Correct", "Yep", "Perfect", "Go ahead", "That works"
      - intent MUST be "confirmation"
      - slots should be empty {} (the user is just confirming, not providing new data)
      - Include casual: "Yep sounds good", "Yeah that's fine", "Mhm okay"
      - Include formal: "Yes that is correct", "Please go ahead and confirm"
      - Include very short: "Yes", "Yeah", "Okay", "Sure", "Yep"
      
      Output format (one JSON per line):
      {"context": "system yes/no question", "utterance": "user confirmation", "intent": "confirmation", "slots": {}}
    n: 100
    few_shot_examples:
      - '{"context": "Is Thursday at 3pm fine for you?", "utterance": "Okay", "intent": "confirmation", "slots": {}}'
      - '{"context": "So I have a cardiology appointment for John Smith on Monday at 10am. Shall I confirm?", "utterance": "Yes please", "intent": "confirmation", "slots": {}}'
      - '{"context": "Would you like me to book that for tomorrow?", "utterance": "Yeah that works", "intent": "confirmation", "slots": {}}'
      - '{"context": "Your appointment is scheduled for Friday at 2pm. Is that correct?", "utterance": "Yep", "intent": "confirmation", "slots": {}}'
      - '{"context": "Shall I go ahead and cancel your appointment?", "utterance": "Sure go ahead", "intent": "confirmation", "slots": {}}'
      - '{"context": "Is Dr. Patel okay for you?", "utterance": "Mhm yes", "intent": "confirmation", "slots": {}}'




  # ================================================================
  # DENIAL — "no" with or without corrections
  # ================================================================

  - name: "Denial"
    instruction: |
      You are generating training data for an AI clinic receptionist's NLU model.
      
      Generate utterances where the user is DENYING or DISAGREEING with something the 
      system said. The system context must be a proposal or question the user rejects.
      
      IMPORTANT: Some denials include corrections with new slot values!
        - "No, make it Friday" → denial + date slot
        - "No not cardiology, I need dermatology" → denial + service_type slot
        - "No" → pure denial, no slots
      
      RULES:
      - Context MUST be a confirmable statement the user disagrees with
      - intent MUST be "denial"
      - slots should contain any NEW values the user provides as corrections
      - Include pure denials: "No", "Nope", "That's wrong", "Not quite"
      - Include denials with corrections: "No, make it Tuesday", "No, I said Dr. Patel"
      - Include polite denials: "Actually no, I'd prefer...", "Not that one..."
      
      Output format (one JSON per line):
      {"context": "system proposal", "utterance": "user denial", "intent": "denial", "slots": {corrections_if_any}}
    n: 100
    few_shot_examples:
      - '{"context": "Is Thursday at 3pm fine for you?", "utterance": "No", "intent": "denial", "slots": {}}'
      - '{"context": "Shall I book cardiology for you?", "utterance": "No not cardiology, I need dermatology", "intent": "denial", "slots": {"service_type": "dermatology"}}'
      - '{"context": "So your appointment is for Monday?", "utterance": "No, make it Friday", "intent": "denial", "slots": {"date": "Friday"}}'
      - '{"context": "I have you down for 3pm, correct?", "utterance": "Actually no, I said 5pm", "intent": "denial", "slots": {"time": "5pm"}}'
      - '{"context": "Is the appointment for Dr. Wilson?", "utterance": "Nope, Dr. Patel please", "intent": "denial", "slots": {"doctor_name": "Dr. Patel"}}'
      - '{"context": "Would you like me to cancel your appointment?", "utterance": "No no don t cancel it", "intent": "denial", "slots": {}}'




